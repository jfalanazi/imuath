<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>iMuath — قريباً</title>
<meta name="description" content="iMuath — مساحة معاذ. قريباً.">
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#0a1a1c">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='16' fill='%230a1a1c'/%3E%3Ctext x='32' y='44' text-anchor='middle' font-family='Arial,Helvetica,sans-serif' font-weight='900' font-size='34' fill='%23eef4f1'%3Ei%3Ctspan fill='%235fd4b8'%3EM%3C/tspan%3E%3C/text%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;800&family=Inter:wght@500;700;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#0a1a1c;--bg2:#10302f;--accent:#5fd4b8;--soft:#c9efe4;--ink:#eef4f1;--muted:#8fa8a3}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{font-family:Tajawal,system-ui,sans-serif;color:var(--ink);background:var(--bg);min-height:100vh;display:flex;align-items:center;justify-content:center;overflow:hidden;position:relative}
body::before{content:"";position:fixed;inset:0;background:
  radial-gradient(700px 420px at 50% 35%,rgba(95,212,184,.13),transparent 70%),
  radial-gradient(1000px 600px at 50% 120%,#14423f,transparent 60%),
  linear-gradient(180deg,var(--bg2),var(--bg));z-index:0}
body::after{content:"";position:fixed;inset:0;z-index:0;opacity:.35;
  background-image:radial-gradient(rgba(201,239,228,.18) 1px,transparent 1px);background-size:26px 26px;
  -webkit-mask-image:radial-gradient(circle at 50% 45%,#000 0,transparent 70%);mask-image:radial-gradient(circle at 50% 45%,#000 0,transparent 70%)}
main{position:relative;z-index:1;text-align:center;padding:40px 24px;width:min(640px,100%)}
.mono{width:84px;height:84px;margin:0 auto 26px;border-radius:24px;display:grid;place-items:center;
  background:linear-gradient(145deg,rgba(255,255,255,.07),rgba(255,255,255,.02));border:1px solid rgba(95,212,184,.35);
  box-shadow:0 20px 50px -20px rgba(0,0,0,.7),inset 0 1px 0 rgba(255,255,255,.06);animation:rise .9s cubic-bezier(.2,.7,.2,1) both}
.mono span{font-family:Inter,sans-serif;font-weight:800;font-size:34px;letter-spacing:-.04em;color:var(--ink);direction:ltr}.mono b{color:var(--accent);font-weight:800}
.brand{font-family:Inter,sans-serif;font-weight:800;font-size:clamp(46px,11vw,78px);letter-spacing:-.03em;line-height:1;direction:ltr;animation:rise .9s .08s cubic-bezier(.2,.7,.2,1) both}
.brand span{color:var(--accent)}
.tag{margin-top:16px;font-size:clamp(18px,4.2vw,22px);font-weight:500;color:#d3e3de;animation:rise .9s .16s cubic-bezier(.2,.7,.2,1) both}
.soon{display:inline-flex;align-items:center;gap:10px;margin-top:34px;padding:10px 18px;border-radius:999px;background:rgba(95,212,184,.12);border:1px solid rgba(95,212,184,.35);color:var(--soft);font-weight:700;font-size:15px;animation:rise .9s .24s cubic-bezier(.2,.7,.2,1) both}
.dot{width:8px;height:8px;border-radius:50%;background:var(--accent);box-shadow:0 0 0 0 rgba(95,212,184,.6);animation:pulse 2s infinite}
footer{position:fixed;bottom:18px;left:0;right:0;text-align:center;z-index:1;font-size:13px;color:var(--muted);direction:ltr;letter-spacing:.04em}
@keyframes rise{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
@keyframes pulse{70%{box-shadow:0 0 0 10px rgba(95,212,184,0)}100%{box-shadow:0 0 0 0 rgba(95,212,184,0)}}
@media (prefers-reduced-motion:reduce){*{animation:none!important}}
</style>
</head>
<body>
<main>
  <div class="mono" aria-hidden="true"><span>i<b>M</b></span></div>
  <h1 class="brand">i<span>M</span>uath</h1>
  <p class="tag">مساحة معاذ</p>
  <div class="soon"><i class="dot" aria-hidden="true"></i>قريباً</div>
</main>
<footer>© <span id="y">2026</span> iMuath</footer>
<script>document.getElementById('y').textContent=new Date().getFullYear()</script>
</body>
</html>
